groups:
  - name: aquasentinel
    rules:
      - alert: ApiDown
        expr: up{job="aquasentinel-api"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "AquaSentinel API is not responding"

      - alert: HighPredictionLatency
        expr: histogram_quantile(0.95, sum(rate(aqua_request_latency_seconds_bucket{path="/predict"}[5m])) by (le)) > 0.5
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency of /predict is above 500 ms"

      - alert: LeakAlertRaised
        expr: increase(aqua_leak_alerts_total[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "The model raised a pipeline leak alert"

      - alert: TooManyAnomalies
        # the watchdog rolls the model back when this stays high
        expr: aqua_recent_anomaly_rate > 0.5
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "More than half of recent readings flagged - model or data problem"

      - alert: DataDriftDetected
        expr: aqua_drift_detected == 1
        labels: {severity: warning}
        annotations:
          summary: "Sensor data drift detected (share {{ $value }}) - retraining should start"

      - alert: HighErrorRate
        expr: sum(rate(aqua_requests_total{status=~"5.."}[5m])) / sum(rate(aqua_requests_total[5m])) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of API requests are failing"
