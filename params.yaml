# AquaSentinel settings. DVC re-runs a stage when a value it uses changes.

simulation:
  network: Net3          # example network that comes with WNTR, used as one supply zone (DMA)
  days: 3                # first day is dropped (tanks still settling)
  normal_scenarios: 12
  leak_scenarios: 24
  leak_area: [0.0005, 0.003]   # leak hole size in m^2 (min, max)
  leak_start_hour: [30, 54]    # leak starts somewhere in this range
  # intermittent supply, as in most Indian cities
  supply_windows: [[5, 8], [17, 19]]   # supply valve open 5-8 am and 5-7 pm
  supply_shift_min: 45         # supply can start up to 45 minutes early or late
  storage_fill: [3.0, 1.6]     # demand when supply starts / ends (households filling tanks and sumps)
  fill_variation: 0.15         # how much water households take varies +/-15% per supply
  off_supply_use: 0.08         # small demand while the valve is closed
  power_cut_chance: 0.3        # chance that a scenario has a 1-3 hour gap in sensor data
  noise_pressure: 0.15         # sensor noise in m
  noise_flow: 1.0              # sensor noise in L/s
  seed: 42

summer:                  # summer rationing: one short supply window and higher demand
  supply_windows: [[6, 8]]
  demand_multiplier: 1.2
  normal_scenarios: 10
  leak_scenarios: 14
  seed: 7

sensors:
  pressure: ["15", "35", "123", "149", "173", "203", "247", "255"]  # junctions
  flow: ["10", "20", "40", "50", "60", "101", "329"]                # pipes
  inflow: ["10", "60", "20", "40", "50"]   # pipes leaving the 2 sources and 3 tanks

model:
  name: aquasentinel-leak-detector
  windows: [1, 4, 12]        # smoothing: 15 min, 1 h, 3 h
  n_estimators: 200
  threshold_percentile: 98   # alarm above the 98th percentile of normal scores
  alert_after: 3             # alert after 3 anomalous readings in a row (45 min)
  test_size: 0.3
  seed: 42

monitoring:
  psi_limit: 0.25            # a column has drifted if its PSI is above this (common rule of thumb)
  drift_share: 0.5           # retrain if half the sensors drifted, or the supply timetable changed
  min_scenarios: 16          # wait for this much new data before retraining
  max_false_alarms: 0.05     # a model with more false alarms is never promoted
