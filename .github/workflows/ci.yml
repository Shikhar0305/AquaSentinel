name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 .

      - name: Unit tests
        run: pytest -q

      - name: Smoke test the full pipeline (small data)
        run: |
          python - <<'PY'
          import yaml
          p = yaml.safe_load(open("params.yaml"))
          p["simulation"]["normal_scenarios"] = 4
          p["simulation"]["leak_scenarios"] = 6
          p["summer"]["normal_scenarios"] = 1
          p["summer"]["leak_scenarios"] = 1
          yaml.safe_dump(p, open("params.yaml", "w"), sort_keys=False)
          PY
          dvc repro
          dvc metrics show
          python -c "import json; m=json.load(open('metrics/train_metrics.json')); print(m); assert m['roc_auc'] > 0.7"

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics/

  # CD: build the Docker image and publish it to GitHub Container Registry (Packages)
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .

      - name: Check the image starts
        run: docker run --rm $IMAGE:latest python -c "import api.main, src.monitor; print('imports ok')"

      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
