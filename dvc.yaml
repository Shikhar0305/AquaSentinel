# Reproducible pipeline:  dvc repro
stages:
  simulate:
    cmd: python -m src.data simulate
    deps: [src/data.py]
    params: [simulation, summer, sensors]
    outs: [data/raw/sensor_data.csv, data/raw/summer_data.csv]

  train:
    cmd: python -m src.train
    deps: [data/raw/sensor_data.csv, src/model.py, src/train.py]
    params: [model]
    metrics:
      - metrics/train_metrics.json:
          cache: false
